name: "Copilot Setup Steps"

# Validate this setup when it changes, and allow manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # This job name is required for GitHub Copilot coding agent setup steps.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VELA_LINEAR_THREADS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 16
          platform: x64

      - name: Report compiler version
        run: |
          gcc --version
          g++ --version

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libsuitesparse-dev \
            libopenblas-pthread-dev \
            libmetis-dev \
            libhdf5-dev \
            libboost-dev \
            libspdlog-dev \
            libeigen3-dev \
            nlohmann-json3-dev \
            catch2 \
            python3 \
            python3-pil \
            python3-numpy \
            python3-h5py

      - name: Check regression Python dependencies
        run: /usr/bin/python3 -c "import h5py, numpy, PIL; print(h5py.version.info)"

      - name: Configure debug build
        # Match the Ubuntu CI configuration; all five adapters are checked
        # separately in CI's UCRT64 job, using their supported package builds.
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DVELA_ENABLE_UMFPACK=ON -DVELA_ENABLE_METIS=ON \
            -DVELA_ENABLE_OPENBLAS_THREAD_CONTROL=ON \
            -DVELA_ENABLE_MUMPS=OFF -DVELA_ENABLE_SUPERLU_MT=OFF \
            -DVELA_ENABLE_STRUMPACK=OFF | tee configure.log
          grep -F 'SuiteSparse UMFPACK bordered solver enabled' configure.log
          grep -F 'SuiteSparse SPQR bordered solver enabled' configure.log
          grep -F 'METIS ordering enabled' configure.log

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
