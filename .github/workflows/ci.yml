name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Regression suite
        type: choice
        options:
          - all
          - pn2d
          - bvmethods
        default: pn2d

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VELA_LINEAR_THREADS: '1'
      PYTHONUTF8: '1'
      VELA_MKL_VERSION: '2026.1.0'
      MKL_THREADING_LAYER: SEQUENTIAL
      MKL_NUM_THREADS: '1'
      P6_ARCHIVE: vela-sde-ubuntu26.04.tar.gz
      REQUESTED_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 16
          platform: x64

      - name: Report compiler version
        run: |
          gcc --version
          g++ --version

      - name: Install build and regression dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            patchelf \
            libsuitesparse-dev \
            libopenblas-pthread-dev \
            libmetis-dev \
            libhdf5-dev \
            libboost-dev \
            libspdlog-dev \
            libeigen3-dev \
            nlohmann-json3-dev \
            catch2 \
            libglu1-mesa \
            python3-venv \
            python3 \
            python3-pil \
            python3-numpy \
            python3-h5py \
            python3-jsonschema

      - name: Check regression Python dependencies
        run: |
          /usr/bin/python3 -c "import h5py, numpy, PIL, jsonschema; jsonschema.Draft202012Validator({'type': 'object'}).validate({}); print(h5py.version.info)"
          patchelf --version

      - name: Cache pinned Gmsh wheel
        uses: actions/cache@v4
        with:
          path: build/gmsh-inputs
          key: sde-gmsh-inputs-v1-ubuntu26.04-${{ runner.arch }}-${{ hashFiles('configs/sde_external_runtimes.json') }}

      - name: Install pinned Gmsh Python API runtime
        run: |
          /usr/bin/python3 scripts/prepare_sde_external_gmsh.py \
            --assets build/gmsh-inputs --runtime build/external-gmsh

      - name: Probe pinned Gmsh runtime
        run: |
          /usr/bin/python3 scripts/probe_gmsh_python.py \
            --output-dir build/gmsh-probe \
            --runtime-dir build/gmsh-python-runtime

      - name: Upload Gmsh probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmsh-runtime-probe
          path: |
            build/gmsh-probe/gmsh_probe_manifest.json
            build/gmsh-probe/fail_report.json
          if-no-files-found: error

      - name: Cache Intel oneMKL runtime
        if: env.REQUESTED_SUITE != 'pn2d'
        id: mkl-cache
        uses: actions/cache@v4
        with:
          path: .ci-onemkl
          key: onemkl-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.VELA_MKL_VERSION }}

      - name: Install Intel oneMKL runtime on cache miss
        if: env.REQUESTED_SUITE != 'pn2d' && steps.mkl-cache.outputs.cache-hit != 'true'
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/mkl-venv"
          "$RUNNER_TEMP/mkl-venv/bin/python" -m pip install --only-binary=:all: \
            --prefix "$PWD/.ci-onemkl" "mkl==$VELA_MKL_VERSION"

      - name: Expose Intel oneMKL runtime
        if: env.REQUESTED_SUITE != 'pn2d'
        run: |
          runtime="$(realpath .ci-onemkl/lib/libmkl_rt.so.3)"
          test -s "$runtime"
          test -s "$(dirname "$runtime")/libmkl_sequential.so.3"
          printf 'VELA_MKL_RT_LIBRARY=%s\n' "$runtime" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s\n' "$(dirname "$runtime")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Cache pinned Eigen and HighFive sources
        id: cmake-source-cache
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/vela_eigen-src
            build/_deps/highfive-src
          key: cmake-sources-v1-ubuntu26.04-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure Release build
        env:
          CMAKE_SOURCE_CACHE_HIT: ${{ steps.cmake-source-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          sources=()
          if [[ "$CMAKE_SOURCE_CACHE_HIT" == 'true' ]]; then
            if [[ -f build/_deps/vela_eigen-src/Eigen/Version ]]; then
              sources+=("-DFETCHCONTENT_SOURCE_DIR_VELA_EIGEN=$PWD/build/_deps/vela_eigen-src")
            fi
            if [[ -f build/_deps/highfive-src/CMakeLists.txt ]]; then
              sources+=("-DFETCHCONTENT_SOURCE_DIR_HIGHFIVE=$PWD/build/_deps/highfive-src")
            fi
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DVELA_PHYSICAL_CONSTANTS_PROFILE=sentaurus_u2022_12 -DVELA_ENABLE_PN2D_CI=ON \
            -DVELA_ENABLE_UMFPACK=ON -DVELA_ENABLE_METIS=ON \
            -DVELA_ENABLE_BVMETHODS_CI=ON \
            -DVELA_ENABLE_OPENBLAS_THREAD_CONTROL=ON \
            -DVELA_ENABLE_MUMPS=OFF -DVELA_ENABLE_SUPERLU_MT=OFF \
            -DVELA_ENABLE_STRUMPACK=OFF "${sources[@]}" | tee configure.log
          grep -F 'SuiteSparse UMFPACK bordered solver enabled' configure.log
          grep -F 'SuiteSparse SPQR bordered solver enabled' configure.log
          grep -F 'METIS ordering enabled' configure.log
          grep -F 'Eigen headers:' configure.log
          grep -F 'Boost headers and PFR:' configure.log
          grep -F 'oneMKL PARDISO runtime backend enabled' configure.log
          grep -F 'VELA_BOOST_PFR_HEADERS_WORK - Success' configure.log

      - name: Build
        id: build
        run: |
          args=(--build build --parallel 2)
          if [[ "$REQUESTED_SUITE" == pn2d ]]; then
            args+=(--target sd-sim vela_example_runner)
          elif [[ "$REQUESTED_SUITE" == bvmethods ]]; then
            args+=(--target sd-sim vela_example_runner test_mkl_pardiso)
          fi
          cmake "${args[@]}"

      - name: Cache locked SDE offline inputs
        if: env.REQUESTED_SUITE == 'all'
        uses: actions/cache@v4
        with:
          path: build/p6-assets
          key: sde-offline-inputs-v1-ubuntu26.04-${{ runner.arch }}-${{ hashFiles('configs/sde_offline_inputs.json') }}

      - name: Assemble and relocate the offline SDE package
        if: env.REQUESTED_SUITE == 'all'
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/prepare_sde_offline_assets.py --assets build/p6-assets
          /usr/bin/python3 scripts/package_sde_modeling.py --assets build/p6-assets --output "build/packages/$P6_ARCHIVE"
          relocated="$PWD/build/relocated tools"
          mkdir -p "$relocated"
          /usr/bin/python3 -m tarfile -e "build/packages/$P6_ARCHIVE" "$relocated" --filter data
          {
            printf 'VELA_P6_PACKAGE=%s\n' "$relocated/vela-sde"
            printf 'VELA_REFERENCE_SDE_TEST_OUTPUT=%s\n' "$PWD/build/baseline-corpus"
          } >> "$GITHUB_ENV"

      - name: Qualify the relocated SDE package on eight sources twice
        if: env.REQUESTED_SUITE == 'all'
        run: |
          /usr/bin/python3 scripts/qualify_sde_package.py --package-root "$VELA_P6_PACKAGE" \
            --output-dir build/package-corpus --gmsh-python "$VELA_GMSH_PYTHON" \
            --gmsh-library "$VELA_GMSH_LIBRARY" --gmsh-executable "$VELA_GMSH_EXECUTABLE"

      - name: Run CTest
        if: success() || (failure() && steps.build.outcome == 'success')
        run: |
          args=(--test-dir build --output-on-failure --no-tests=error --parallel 4
                --output-junit "$PWD/build/ctest.xml")
          if [[ "$REQUESTED_SUITE" == pn2d ]]; then
            args+=(-L '^pn2d-ci$')
          elif [[ "$REQUESTED_SUITE" == bvmethods ]]; then
            build/test_mkl_pardiso '[mkl_runtime]'
            args+=(-L '^bvmethods-ci$')
          fi
          ctest "${args[@]}"

      - name: Retain SDE package and structured qualification
        if: always() && env.REQUESTED_SUITE == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: sde-qualification-ubuntu26.04
          path: |
            build/packages/*
            build/package-corpus/qualification.json
            build/package-corpus/**/fail_report.json
            build/baseline-corpus/case_summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CTest regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-regression
          path: |
            build/ctest.xml
            build/pn2d-reports/*.json
            build/pn2d-reports/*.log
            build/bvmethods-reports/*.json
            build/bvmethods-reports/*.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
