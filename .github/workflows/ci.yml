name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VELA_LINEAR_THREADS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 16
          platform: x64

      - name: Report compiler version
        run: |
          gcc --version
          g++ --version

      - name: Install build and regression dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            patchelf \
            libsuitesparse-dev \
            libopenblas-pthread-dev \
            libmetis-dev \
            libhdf5-dev \
            libboost-dev \
            libspdlog-dev \
            libeigen3-dev \
            nlohmann-json3-dev \
            catch2 \
            libglu1-mesa \
            python3-venv \
            python3 \
            python3-pil \
            python3-numpy \
            python3-h5py \
            python3-jsonschema

      - name: Check regression Python dependencies
        run: |
          /usr/bin/python3 -c "import h5py, numpy, PIL, jsonschema; jsonschema.Draft202012Validator({'type': 'object'}).validate({}); print(h5py.version.info)"
          patchelf --version

      - name: Install pinned Gmsh Python API runtime
        # Share configs/sde_external_runtimes.json with the SDE qualification job.
        run: |
          /usr/bin/python3 scripts/prepare_sde_external_gmsh.py \
            --assets build/gmsh-inputs --runtime build/external-gmsh

      - name: Probe pinned Gmsh runtime
        run: |
          /usr/bin/python3 scripts/probe_gmsh_python.py \
            --output-dir build/gmsh-probe \
            --runtime-dir build/gmsh-python-runtime

      - name: Upload Gmsh probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmsh-runtime-probe
          path: |
            build/gmsh-probe/gmsh_probe_manifest.json
            build/gmsh-probe/fail_report.json
          if-no-files-found: error

      - name: Configure debug build
        # This job has no MKL runtime; keep PARDISO and optional OpenMP backends disabled.
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DVELA_ENABLE_UMFPACK=ON -DVELA_ENABLE_METIS=ON \
            -DVELA_ENABLE_MKL_PARDISO=OFF \
            -DVELA_ENABLE_OPENBLAS_THREAD_CONTROL=ON \
            -DVELA_ENABLE_MUMPS=OFF -DVELA_ENABLE_SUPERLU_MT=OFF \
            -DVELA_ENABLE_STRUMPACK=OFF | tee configure.log
          grep -F 'SuiteSparse UMFPACK bordered solver enabled' configure.log
          grep -F 'SuiteSparse SPQR bordered solver enabled' configure.log
          grep -F 'METIS ordering enabled' configure.log
          grep -F 'Eigen headers:' configure.log
          grep -F 'Boost headers and PFR:' configure.log
          grep -F 'oneMKL PARDISO runtime backend disabled' configure.log
          grep -F 'VELA_BOOST_PFR_HEADERS_WORK - Success' configure.log

      - name: Build
        run: cmake --build build --parallel

      - name: Run test suite
        run: ctest --test-dir build --output-on-failure

  sde-modeling:
    name: SDE modeling qualification
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VELA_LINEAR_THREADS: '1'
      PYTHONUTF8: '1'
      P6_PYTHON: /usr/bin/python3
      P6_BUILD: build-p6
      P6_ARCHIVE: vela-sde-ubuntu26.04.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config \
            libboost-dev libeigen3-dev libspdlog-dev nlohmann-json3-dev catch2 \
            libhdf5-dev libsuitesparse-dev libmetis-dev libglu1-mesa patchelf \
            python3-venv python3-jsonschema python3-numpy python3-h5py python3-pil
          cmake -S . -B build-p6 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE=/usr/bin/python3 -DVELA_ENABLE_MKL_PARDISO=OFF \
            -DVELA_ENABLE_MUMPS=OFF -DVELA_ENABLE_SUPERLU_MT=OFF -DVELA_ENABLE_STRUMPACK=OFF
      - name: Build runtime programs independently
        run: cmake --build "$P6_BUILD" --target sd-sim vela vela_example_runner sentaurus_import --parallel 2
      - name: Fetch hash-locked offline build inputs
        run: '"$P6_PYTHON" scripts/prepare_sde_offline_assets.py --assets "$P6_BUILD/p6-assets"'
      - name: Prepare separately supplied Gmsh runtime
        run: '"$P6_PYTHON" scripts/prepare_sde_external_gmsh.py --assets "$P6_BUILD/gmsh-inputs" --runtime "$P6_BUILD/external-gmsh"'
      - name: Assemble package without network access
        run: '"$P6_PYTHON" scripts/package_sde_modeling.py --assets "$P6_BUILD/p6-assets" --output "$P6_BUILD/packages/$P6_ARCHIVE"'
      - name: Relocate extracted package
        run: |
          "$P6_PYTHON" -c 'import os,tarfile,zipfile,pathlib; b=pathlib.Path(os.environ["P6_BUILD"]); p=b/"packages"/os.environ["P6_ARCHIVE"]; d=b/"relocated tools"; d.mkdir(); (zipfile.ZipFile(p).extractall(d) if p.suffix==".zip" else tarfile.open(p).extractall(d,filter="data"))'
          "$P6_PYTHON" -c 'import os,pathlib; f=pathlib.Path(os.environ["GITHUB_ENV"]); b=pathlib.Path(os.environ["P6_BUILD"]); f.open("a").write("VELA_P6_PACKAGE="+str((b/"relocated tools/vela-sde").resolve())+"\nVELA_REFERENCE_SDE_TEST_OUTPUT="+str((b/"baseline-corpus").resolve())+"\n")'
      - name: Eight sources twice in the isolated package
        run: |
          "$P6_PYTHON" scripts/qualify_sde_package.py --package-root "$VELA_P6_PACKAGE" \
            --output-dir "$P6_BUILD/package-corpus" --gmsh-python "$VELA_GMSH_PYTHON" \
            --gmsh-library "$VELA_GMSH_LIBRARY" --gmsh-executable "$VELA_GMSH_EXECUTABLE"
      - name: Required modeling and package regressions
        run: |
          ctest --test-dir "$P6_BUILD" --output-on-failure --no-tests=error --parallel 2 \
            -R '^(sde_p6_package|sde_p6_validation|sde_integral_control|sde_sdevice_checks|reference_sde_cases|sentaurus_sde_frontend|sentaurus_ir_v2_contract|sentaurus_mesh_builder|sentaurus_device_e2e_contract|sentaurus_gmsh_m[1-5]|sdevice_mesh_import|sdevice_vela_launcher|gmsh_python_runtime|pn2d_config_templates)$'
      - name: Retain package and structured qualification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sde-qualification-ubuntu26.04
          path: |
            ${{ env.P6_BUILD }}/packages/*
            ${{ env.P6_BUILD }}/package-corpus/qualification.json
            ${{ env.P6_BUILD }}/baseline-corpus/case_summary.json
          if-no-files-found: warn
          retention-days: 14
